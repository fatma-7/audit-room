<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Audit Room</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + stage stepper, one working stage at a time, evidence locker as a side drawer.
   Look follows the Lab 11 deck: graphite panels, pale periwinkle glass accents, tight heavy sans headings. */
:root{
  --bg:#dde4ec; --bg-glow:#bcd3f2; --panel:#f4f7fb; --panel-2:#e6ecf4; --line:#c2cddb;
  --fg:#1c232c; --muted:#53606f; --accent:#2f6fc7; --accent-fg:#ffffff; --accent-soft:#cfe0f8;
  --pass:#17724a; --pass-bg:#d3eedf; --partial:#8f5a00; --partial-bg:#f8e6c2; --fail:#b3261e; --fail-bg:#f8d9d6;
  --term-bg:#171b20; --term-fg:#c9defc; --term-dim:#7c8a9b; --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -18px rgba(30,50,80,.45);
  --f-display:'Inter Tight','Inter',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#232528; --bg-glow:#2f4a73; --panel:#2d2f33; --panel-2:#383b40; --line:#484c53;
  --fg:#eef1f5; --muted:#a5aebb; --accent:#8db9f0; --accent-fg:#0f2340; --accent-soft:#34495f;
  --pass:#6fd69d; --pass-bg:#21402f; --partial:#f0b64f; --partial-bg:#46391b; --fail:#ff8f85; --fail-bg:#4a2523;
  --term-bg:#14171b; --term-fg:#c9defc; --term-dim:#7c8a9b; --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px -18px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#232528; --bg-glow:#2f4a73; --panel:#2d2f33; --panel-2:#383b40; --line:#484c53;
  --fg:#eef1f5; --muted:#a5aebb; --accent:#8db9f0; --accent-fg:#0f2340; --accent-soft:#34495f;
  --pass:#6fd69d; --pass-bg:#21402f; --partial:#f0b64f; --partial-bg:#46391b; --fail:#ff8f85; --fail-bg:#4a2523;
  --term-bg:#14171b; --term-fg:#c9defc; --term-dim:#7c8a9b; --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px -18px rgba(0,0,0,.8);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px;min-height:100%;
  background-image:radial-gradient(900px 420px at 85% -80px,var(--bg-glow),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,5vw,48px);font-weight:800}
h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tools{display:flex;gap:12px;align-items:center}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter .bar{width:84px;height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--pass);transition:width .4s, background .3s}
.meter.mid .bar i{background:var(--partial)} .meter.low .bar i{background:var(--fail)}
.meter b{color:var(--fg);font-variant-numeric:tabular-nums;min-width:2ch}
.lockbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.lockbtn span{background:var(--accent);color:var(--accent-fg);border-radius:99px;min-width:22px;text-align:center;font-size:12px;padding:0 6px}

.steps{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--panel-2);color:var(--muted);font-variant-numeric:tabular-nums}
.step.cur{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border-color:var(--accent)}
.step.cur i{background:var(--accent);color:var(--accent-fg)}
.step.done i{background:var(--pass-bg);color:var(--pass)}
.step.lock{opacity:.5;cursor:not-allowed}

/* shared parts */
.stage{padding-top:22px;display:grid;gap:20px}
.head{display:grid;gap:10px;max-width:760px}
.head p{color:var(--muted);font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--panel-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.grid2.wide2{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media(max-width:860px){.grid2,.grid2.wide,.grid2.wide2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
@media(min-width:861px) and (max-width:1020px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14px;transition:transform .1s,background .15s}
.btn:hover{background:var(--panel-2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.pass{background:var(--pass-bg);color:var(--pass);border-color:transparent}
.pill.partial{background:var(--partial-bg);color:var(--partial);border-color:transparent}
.pill.fail{background:var(--fail-bg);color:var(--fail);border-color:transparent}
.note{font-size:13px;color:var(--muted)}
.callout{border-radius:14px;padding:12px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel-2)}
.callout.warn{background:var(--partial-bg);color:var(--partial);border-color:transparent}
.callout.bad{background:var(--fail-bg);color:var(--fail);border-color:transparent}
.callout.good{background:var(--pass-bg);color:var(--pass);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button[aria-pressed="true"].p-pass{background:var(--pass);color:var(--panel)}
.seg button[aria-pressed="true"].p-partial{background:var(--partial);color:var(--panel)}
.seg button[aria-pressed="true"].p-fail{background:var(--fail);color:var(--panel)}
.seg button[disabled]{cursor:default}

/* pinnable things */
[data-pin]{cursor:pointer;position:relative;transition:background .15s,box-shadow .15s}
[data-pin]:hover{box-shadow:inset 0 0 0 1px var(--accent)}
[data-pin].pinned{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pinmark{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);opacity:0}
[data-pin]:hover .pinmark,[data-pin]:focus-visible .pinmark{opacity:.9}
[data-pin].pinned .pinmark{opacity:1}
[data-pin].pinned .pinmark::after{content:"pinned"} [data-pin]:not(.pinned) .pinmark::after{content:"pin"}

/* briefing */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;padding:10px 0 4px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(40px,7.5vw,88px);letter-spacing:-.04em;line-height:.92}
.hero h2 em{font-style:normal;color:var(--accent)}
.letter{font-family:var(--f-mono);font-size:13px;line-height:1.65;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 24px;position:relative}
.letter::before{content:"CONFIDENTIAL · AUDIT MANDATE";position:absolute;top:-10px;left:18px;background:var(--fg);color:var(--bg);font-size:10px;padding:2px 8px;letter-spacing:.1em;border-radius:3px}
.letter h4{margin:10px 0 2px;font-size:13px}
.letter ul{margin:2px 0 8px;padding-left:18px}
.scope{display:grid;gap:8px}
.scope-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;background:var(--panel)}
.scope-row.ok{border-color:var(--pass)} .scope-row.no{border-color:var(--fail);background:var(--fail-bg)}
.role{display:grid;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.role b{font-family:var(--f-display);font-size:16px}
.role span{font-size:13px;color:var(--muted)}
input[type=text]{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 12px;min-width:0}
.badge{display:flex;gap:16px;align-items:center;border:2px dashed var(--pass);border-radius:16px;padding:14px 18px;background:var(--pass-bg);color:var(--pass)}
.badge b{font-family:var(--f-display);font-size:20px}

/* browser sim */
.browser{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.chrome{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.urlbar{flex:1;min-width:0;display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;font-family:var(--f-mono);font-size:12.5px}
.urlbar .pre{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.urlbar input{width:6.2ch;border:0;background:transparent;color:var(--fg);font:inherit;padding:2px 0;outline:none;font-weight:600;border-bottom:2px solid var(--accent)}
.urlbar .go{border:0;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;margin-left:8px}
.lock{color:var(--pass);font-size:12px;margin-right:6px;white-space:nowrap}
.bbody{padding:18px;display:grid;gap:12px;min-height:340px}
.sess{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rec{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rec>div{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:10px;padding:8px 40px 8px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.rec>div:last-child{border-bottom:0}
.rec dt,.rec .k{color:var(--muted)} .rec .v{overflow-wrap:anywhere}
.errpage{display:grid;place-items:center;text-align:center;gap:6px;min-height:260px;padding:20px}
.errpage b{font-family:var(--f-display);font-size:44px;letter-spacing:-.03em}
.pips{display:flex;gap:6px}.pips i{width:26px;height:10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}
.pips i.used{background:var(--partial);border-color:transparent}.pips i.over{background:var(--fail);border-color:transparent}
.obs{display:grid;gap:8px}
.obs [data-pin]{border:1px solid var(--line);border-radius:12px;padding:10px 64px 10px 14px;font-size:14px;background:var(--panel)}

/* data map */
.cols{display:grid;gap:8px}
.col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;background:var(--panel)}
.col.removed{opacity:.6;background:var(--panel-2)} .col.removed .cn{text-decoration:line-through}
.col .cn{font-family:var(--f-mono);font-size:13px;font-weight:500}
.col .cv{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col.wrong{border-color:var(--fail);background:var(--fail-bg)}
@media(max-width:560px){.col{grid-template-columns:minmax(0,1fr) auto}.col .cv{display:none}}
.dash{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.dash header{padding:12px 16px;background:linear-gradient(120deg,var(--accent-soft),var(--panel));font-family:var(--f-display);font-weight:700}
.dash .tile{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.dash .tile.broken{background:var(--fail-bg);color:var(--fail)}
.hist{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0 0;border-bottom:1px solid var(--line)}
.hist i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:4px;transition:background .2s,opacity .2s}
.hist i.old{background:var(--fail);opacity:.75}
.hist-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono);padding-top:4px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* vault */
.vault{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.vault{grid-template-columns:minmax(0,1fr)}}
.files{display:grid;gap:6px;align-content:start}
.file{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;display:flex;justify-content:space-between;gap:8px;min-width:0;overflow-wrap:anywhere}
.file.cur{border-color:var(--accent);background:var(--accent-soft)} .file.seen::after{content:"read";color:var(--muted);font-family:var(--f-body);font-size:11px}
.file.ghost{border-style:dashed;color:var(--muted);cursor:default}
.doc{display:grid;gap:0;align-content:start}
.doc h3{margin-bottom:12px}
.doc .blk{padding:10px 70px 10px 14px;border-radius:10px;margin:0}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc td,.doc th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.doc tr.blk td:last-child{padding-right:20px}
.doc tr[data-pin]:hover{background:var(--panel-2);box-shadow:none}
.doc tr[data-pin].pinned{background:var(--accent-soft);box-shadow:none}
.tblscroll{overflow-x:auto}
mark{background:var(--partial-bg);color:var(--partial);border-radius:3px;padding:0 2px}
.hits{display:grid;gap:6px;margin-top:8px}
.hit{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px}
.hit small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}

/* terminal */
.term{background:var(--term-bg);color:var(--term-fg);border-radius:14px;padding:14px 4px;font-family:var(--f-mono);font-size:12.5px;min-height:300px;overflow-x:auto;border:1px solid var(--line)}
.term .ln{padding:3px 70px 3px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.term .ln.cmd{color:#8db9f0;margin-top:8px}
.term .ln.dim{color:var(--term-dim)}
.term [data-pin]{border-radius:0}
.term [data-pin]:hover{box-shadow:inset 0 0 0 1px #8db9f0}
.term [data-pin].pinned{background:rgba(141,185,240,.18);box-shadow:inset 3px 0 0 #8db9f0}
.term .pinmark{color:#8db9f0}
.term .bad{color:#ff8f85}.term .okk{color:#6fd69d}
.cmds{display:grid;gap:8px}
.cmds button{text-align:left;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}
.cmds button:hover{background:var(--panel-2)} .cmds button.ran{border-color:var(--accent)}
.login{display:grid;gap:8px;max-width:340px}
.login input{width:100%;opacity:.7}

/* locker */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:40;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px -20px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
.drawer.open{transform:none}
.drawer .list{overflow:auto;display:grid;gap:8px;align-content:start;margin-top:12px;flex:1}
.pinitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--panel-2);display:grid;gap:4px}
.pinitem small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.pinitem button{justify-self:start;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--fail);color:var(--panel)}

/* verdict */
.vrow{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.vtop{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.vtop b{font-size:15px}.vtop small{color:var(--muted);margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 12px;font-size:12.5px;max-width:100%;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.rel{border-color:var(--pass)}.chip.noise{border-color:var(--partial)}
.evbtn{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;padding:0;text-decoration:underline}
.vrow.right{border-color:var(--pass)}.vrow.wrong{border-color:var(--fail)}
.why{font-size:13.5px;color:var(--muted)}
.stat{display:grid;gap:2px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.stat b{font-family:var(--f-display);font-size:38px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.rank{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em}

/* fix sprint */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1020px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--panel-2);display:grid;gap:8px;align-content:start;min-height:140px}
.lane header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane header b{font-family:var(--f-display);font-size:16px}
.lane header span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lane.full{border-color:var(--partial)}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;font-size:13.5px}
.fcard .bs{display:flex;gap:4px;flex-wrap:wrap}
.fcard .bs button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:600}
.fcard .bs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.fcard.good{border-color:var(--pass)}.fcard.bad{border-color:var(--fail)}
.fcard .fb{font-size:12.5px;color:var(--muted)}
.backlog{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.reaudit{display:grid;gap:8px}
.rarow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--panel);font-size:14px}
.rarow .arrow{color:var(--muted)}
.big{font-family:var(--f-display);font-size:clamp(46px,8vw,92px);font-weight:800;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
pre.report{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--term-bg);color:var(--term-fg);border-radius:14px;padding:18px;margin:0;max-height:520px;overflow:auto;border:1px solid var(--line)}
ol.q{margin:0;padding-left:20px;display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){

/* ---------------- data ---------------- */
const CHECKS=[
 {id:'c1',name:'Lawful basis documented',art:'Art. 6',key:'pass',where:'Policy Vault',why:'Every purpose in the lawful basis register names a basis: public task, contract or consent.'},
 {id:'c2',name:'Data minimisation',art:'Art. 5(1)(c)',key:'fail',where:'Data Map and the portal record view',why:'Five of the twelve columns (next-of-kin home address, passport number, religion, social handle, parental income) are not needed to run the portal. The register even says no special-category data is processed, yet religion is stored.'},
 {id:'c3',name:'Privacy notice (purpose)',art:'Art. 13',key:'pass',where:'Policy Vault',why:'The notice says why data is used, who receives it, what rights students have and who the DPO is.'},
 {id:'c4',name:'Data accuracy',art:'Art. 5(1)(d)',key:'pass',where:'Policy Vault',why:'Students can correct their own details and must confirm them every September.'},

 {id:'c6',name:'Encryption in transit / at rest',art:'Art. 32',key:'partial',where:'Config Lab',why:'TLS 1.3 and an encrypted primary database are good, but nightly backups are stored unencrypted, which the university’s own policy forbids.'},
 {id:'c7',name:'Access control and MFA',art:'Art. 32',key:'fail',where:'Portal Probe and Config Lab',why:'Any logged-in student can read another student’s record by changing a sequential ID, and none of the 14 admin accounts use MFA (the policy only says it “should”).'},
 {id:'c8',name:'Breach procedure (72 h)',art:'Art. 33',key:'pass',where:'Policy Vault',why:'A written procedure sets the 72-hour ICO clock, names the DPO and was tested in May 2026.'},

const CK=Object.fromEntries(CHECKS.map(c=>[c.id,c]));

const DOCS=[
 {id:'d1',file:'01_Lawful_Basis_Register.docx',title:'Lawful Basis Register',blocks:[
  ['b1','Owner: Data Protection Office · last reviewed 12 March 2026',[]],
  ['b2','Admissions and enrolment — lawful basis: public task (Art. 6(1)(e)). Special-category data: none processed.',['c1','c2']],
  ['b3','Grades and assessment — lawful basis: public task (Art. 6(1)(e)).',['c1']],
  ['b4','Student portal accounts — lawful basis: contract (Art. 6(1)(b)).',['c1']],

 {id:'d2',file:'02_Student_Privacy_Notice.pdf',title:'Student Privacy Notice (v4.2)',blocks:[

 {id:'d3',file:'03_Data_Quality_Procedure.docx',title:'Data Quality Procedure',blocks:[
  ['b1','Students can view and correct their contact details in the portal at any time.',['c4']],

 {id:'d4',file:'04_Breach_Response.docx',title:'Personal Data Breach Response',blocks:[

const FIELDS=[['name','Full name',[]],['email','University email',[]],['addr','Home address',[]],['course','Course',[]],['grades','Grades',[]],['ec','Emergency contact',[]],
 ['nokAddr','Next-of-kin home address',['c2']],['passport','Passport number',['c2']],['religion','Religion',['c2']],['social','Social media handle',['c2']],['income','Parental income',['c2']]];

 ['student_id','20481',1,'Nobody could log in or be matched to a record.'],

 {id:'f1',t:'Add a server-side ownership check to every record request, then patch and re-test.',ok:[0],fixes:'c7',why:'Closes the hole students are exposed to right now.'},
 {id:'f2',t:'Enforce MFA on all 14 admin accounts.',ok:[0],fixes:'c7',why:'Admin accounts reach everything. Cheap to switch on and high impact.'},

function mountBrief(st){

  <section class="hero"><div class="head"><div class="eyebrow">Part 2 · hands-on</div>

    <div class="card flat"><div class="eyebrow">Suggested pace for a 55-minute lab</div><div class="row" style="margin-top:8px;gap:6px">
      <span class="pill">Briefing 5</span><span class="pill">Stations 25</span><span class="pill">Verdict 8</span><span class="pill">Fix sprint 10</span><span class="pill">Debrief 7</span></div>

  <section class="grid2">

      <h4>YOU ARE NOT AUTHORISED TO</h4><ul><li>Touch the live Library system, staff mailboxes or any real student’s account.</li><li>Guess or reset passwords.</li><li>Copy, export or keep any personal data.</li></ul>
      <h4>IF YOU FIND SOMETHING SERIOUS</h4><p>Stop. Tell the DPO the same day, in writing.</p></div>
    <div class="card" style="display:grid;gap:12px;align-content:start"><h3>Read the letter, then mark each action</h3>

   <div class="row" style="gap:24px;align-items:flex-end"><div class="big" id="bigN">${quiet?pass:5}</div><div><div class="rank" style="font-size:26px">of 10 checks compliant</div><p class="note">Up from 5. Triage score ${sc.tri}%.</p></div></div>
   <div class="callout ${S.fix.f1===0?'good':S.fix.f1===1?'warn':'bad'}"><b>Exposure clock:</b> with your plan, any logged-in student could read other students’ records for ${exposure()}. ${S.fix.f1===0?'You closed it first.':'Every day the ownership check waits is another day of possible breach under UK GDPR, and a 72-hour ICO clock if it is exploited.'}</div>
   <div class="reaudit">${CHECKS.map(c=>`<div class="rarow"><span>${c.name}</span><span class="pill ${c.key}">${c.key}</span><span class="arrow">→</span><span class="pill ${after[c.id]}">${after[c.id]}</span></div>`).join('')}</div>
   ${S.patched?'<p class="note">The ownership check is live in the Portal Probe. Go back and re-test account 20482 to see it return 403.</p>':'<div class="callout bad">Your plan did not include an ownership check, so the portal is still open. Go back to the Portal Probe and you will see it.</div>'}
   <div class="row"><button class="btn primary" type="button" data-go="7">Build my audit report</button></div></div>`;
  if(!quiet){const big=$('#bigN');let n=5;const iv=setInterval(()=>{n++;if(n>pass){clearInterval(iv);return;}big.textContent=n;},220);}
  $('#reaudit').disabled=true;
}

/* ---------------- stage 7 : report ---------------- */
function reportText(){
  const sc=scoreAll(),d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const L=[];
  L.push('GDPR AUDIT REPORT — Northbridge University (simulated)');
  L.push('Auditor: '+(S.name||'Trainee Auditor')+'   Date: '+d);
  L.push('Scope: Student Portal test environment (accounts 20481-20485), students database structure, Policy Vault, read-only configuration scans.');
  L.push('');L.push('FINDINGS');
  CHECKS.forEach((c,i)=>{const v=(S.verdict[c.id]||'not rated').toUpperCase();const ev=(S.attach[c.id]||[]).map(id=>S.pins[id]).filter(Boolean);
    L.push((i+1)+'. '+c.name+' ('+c.art+'): '+v);ev.forEach(e=>L.push('   - '+e.text+' ['+e.src+']'));});
  L.push('');
  const f=Object.values(S.verdict);
  L.push('OVERALL: '+(f.includes('fail')?'Not compliant. Remediation required before sign-off.':f.includes('partial')?'Partially compliant.':'Compliant.'));
  L.push('');L.push('ACTION PLAN');
  BUCKETS.slice(0,3).forEach((b,i)=>{L.push(b.n.toUpperCase()+' ('+b.s+')');const it=FIX.filter(x=>S.fix[x.id]===i);if(!it.length)L.push('   (none)');it.forEach(x=>L.push('   - '+x.t));});
  L.push('');L.push('Exposure with this plan: records readable by any logged-in student for '+exposure()+'.');
  L.push('Conduct during the audit: '+S.conduct+'/100'+(S.log.length?' ('+S.log.join('; ')+')':' (no breaches of scope)')+'.');
  L.push('Evidence discipline: '+sc.qual+'% of attached evidence was relevant.');
  return L.join('\n');
}
function mountReport(st){
  const sc=scoreAll();
  st.innerHTML=head('Report and debrief','Your audit, on one page.','Copy this into your lab write-up. Then use the debrief questions to link what you did back to Part 1.')+
  `<div class="grid4"><div class="stat"><b>${sc.acc}%</b><span>Accuracy</span></div><div class="stat"><b>${sc.ev}%</b><span>Evidence</span></div><div class="stat"><b>${sc.cond}%</b><span>Conduct</span></div><div class="stat"><b>${sc.tri}%</b><span>Triage</span></div></div>
   <div class="card" style="display:grid;gap:6px"><div class="eyebrow">Your rank</div><div class="rank">${rankOf(sc)}</div></div>
   <div class="row"><button class="btn primary" type="button" id="copyR">Copy report</button><span class="note" id="cmsg"></span></div>
   <pre class="report" id="rep" tabindex="0">${esc(reportText())}</pre>
   <div class="grid2"><div class="card"><h3 style="margin-bottom:10px">Debrief questions</h3><ol class="q">
     <li>You read another student’s record in one request. What made that lawful for you and unlawful for the student in Part 1?</li>
     <li>Which of the three traps tempted your team most, and what would it have cost the university on a real system?</li>
     <li>A board will fund only one thing this quarter. Which fix do you defend, and what does waiting cost on each of the others?</li>
     <li>Pick the check you were least sure of. What extra evidence would change your mind?</li></ol></div>
    <div class="card"><h3 style="margin-bottom:10px">60-second DPO briefing</h3><p class="note" style="margin-bottom:10px">Pairs: one is the auditor, one is the DPO. Deliver in this order, then swap.</p><ol class="q">
     <li><b>What we found.</b> One sentence, plain English.</li><li><b>Who could be harmed.</b> How many people and what data.</li><li><b>What we need approved.</b> Your Fix Now list.</li><li><b>By when.</b> And what happens if it slips.</li></ol></div></div>
   <div class="row"><button class="btn danger" type="button" id="restart">Restart the lab</button></div>`;
}

/* ---------------- events ---------------- */
const MOUNT=[mountBrief,mountProbe,mountMap,mountVault,mountConfig,mountVerdict,mountFix,mountReport];
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if((b=t.closest('[data-go]'))){go(+b.dataset.go);return;}
  if((b=t.closest('[data-pin]'))){togglePin(b.dataset.pin);return;}
  if((b=t.closest('[data-unpin]'))){togglePin(b.dataset.unpin);return;}
  if((b=t.closest('[data-scope]'))){if(S.signed)return;const[i,v]=b.dataset.scope.split(':').map(Number);S.scope[i]=v;save();const row=$('[data-row="'+i+'"]');row.className='scope-row';$$('button',row).forEach(x=>x.setAttribute('aria-pressed',x.dataset.scope===b.dataset.scope));$('#scopeMsg').innerHTML='';$('#sign').disabled=!SYSTEMS.every((q,k)=>S.scope[k]!==undefined);return;}
  if(t.closest('#sign')){
    S.name=($('#aname').value||'').trim();const bad=SYSTEMS.map((s,i)=>S.scope[i]!==s[1]?i:-1).filter(i=>i>=0);
    if(bad.length){$$('.scope-row').forEach((r,i)=>r.className='scope-row '+(bad.includes(i)?'no':'ok'));$('#scopeMsg').innerHTML=`<div class="callout bad"><b>${bad.length} mismatch${bad.length>1?'es':''}.</b> Re-read the letter. Only what is written in it is covered, and a good reason never widens it. On a real engagement, getting this wrong is where an audit becomes an offence.</div>`;return;}
    S.signed=true;save();steps();mountBrief($('#stage'));toast('Letter signed. Stations unlocked.');return;}
  if(t.closest('#pgo')){probe($('#pid').value);return;}
  if(t.closest('#exportBtn')){if(!S.exported){S.exported=true;conduct(-40,'You tried to export personal data.');}else toast('Blocked again. Auditors describe exposure, they never keep the data.',true);$('#pbody').insertAdjacentHTML('afterbegin','<div class="callout bad"><b>Blocked by lab rules.</b> Your letter forbids copying or exporting personal data. Describe what was exposed, never the data itself.</div>');return;}
  if((b=t.closest('[data-col]'))){const[n,a]=b.dataset.col.split(':');S.map[n]=a;S._wrong=null;save();drawCols();return;}
  if(t.closest('#mapCheck')){mapCheck();return;}
  if(t.closest('#mapShow')){COLS.forEach(c=>S.map[c[0]]=c[2]?'keep':'remove');S._wrong=null;save();drawCols();mapCheck();return;}
  if((b=t.closest('[data-doc]'))){openDoc(b.dataset.doc,b.dataset.hl);return;}
  if((b=t.closest('[data-scan]'))){const i=+b.dataset.scan;if(S.term.includes(i)){toast('You already ran that scan.');return;}if(!S.term.length)$('#term').innerHTML='';S.term.push(i);save();b.classList.add('ran');termWrite(i,false);steps();return;}
  if(t.closest('#guess')){if(!S.guessed){S.guessed=true;conduct(-30,'You tried to guess admin passwords.');}else toast('Out of scope. Guessing passwords is never part of an audit letter like this.',true);return;}
  if((b=t.closest('[data-rate]'))){const[c,r]=b.dataset.rate.split(':');S.verdict[c]=r;save();$('[data-v="'+c+'"]').outerHTML=vrow(CK[c]);return;}
  if((b=t.closest('[data-open]'))){const c=b.dataset.open;S._open=S._open===c?null:c;CHECKS.forEach(k=>{const el=$('[data-v="'+k.id+'"]');if(el)el.outerHTML=vrow(k);});return;}
  if((b=t.closest('[data-att]'))){const[c,p]=b.dataset.att.split(':');const a=S.attach[c]||(S.attach[c]=[]);const i=a.indexOf(p);if(i>=0)a.splice(i,1);else a.push(p);save();$('[data-v="'+c+'"]').outerHTML=vrow(CK[c]);return;}
  if(t.closest('#submitV')){const miss=CHECKS.filter(c=>!S.verdict[c.id]);if(miss.length){$('#vmsg').textContent='Rate all 10 checks first ('+miss.length+' left).';return;}S.submitted=true;save();steps();mountVerdict($('#stage'));vscore();return;}
  if((b=t.closest('[data-fx]'))){const[id,v]=b.dataset.fx.split(':');const n=+v;if(S.reaudited){toast('The plan is locked after the re-audit.');return;}
    if(n<0)delete S.fix[id];else{const cap=BUCKETS[n].cap;const cnt=FIX.filter(f=>S.fix[f.id]===n&&f.id!==id).length;if(cnt>=cap){toast(BUCKETS[n].n+' is full ('+cap+' max). What can wait?',true);return;}S.fix[id]=n;}
    save();drawBoard();return;}
  if(t.closest('#reaudit')){reaudit(false);return;}
  if(t.closest('#copyR')){const txt=reportText(),m=$('#cmsg');const fb=()=>{const r=document.createRange();r.selectNodeContents($('#rep'));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Report selected. Press Ctrl/Cmd+C to copy.';};
    try{navigator.clipboard.writeText(txt).then(()=>m.textContent='Copied.',fb);}catch(x){fb();}return;}
  if(t.closest('#restart')){S=fresh();save();meter();pinCount();go(0);return;}
  if(t.closest('#lockBtn')){$('#drawer').classList.add('open');$('#scrim').classList.add('open');renderLocker();return;}
  if(t.closest('#closeLock')||t===$('#scrim')){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-pin]')){e.preventDefault();togglePin(e.target.dataset.pin);}
  if(e.key==='Enter'&&e.target.id==='pid'){probe(e.target.value);}
  if(e.key==='Escape'){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='ret'){S.ret=+e.target.value;save();drawHist();}
  if(e.target.id==='q')search(e.target.value);
  if(e.target.id==='aname')S.name=e.target.value;
});

meter();pinCount();go(locked(S.stage)?0:S.stage);
})();
</script>
